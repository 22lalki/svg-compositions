<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <style>
      .bg { fill: #eeeefa; }
      .body { fill: url(#grad); stroke: #333; stroke-width: 4; }
      .group-a { fill: #ff6584; opacity: .8 }
      #special { fill: #6c63ff }
      g.group-a rect:nth-child(2) { fill: #3f3d56 }
    </style>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/><stop offset="1" stop-color="#ff6584"/>
    </linearGradient>
  </defs>
  <rect class="bg" x="10" y="10" width="380" height="280" rx="20"/>
  <ellipse class="body" cx="120" cy="150" rx="80" ry="60" transform="rotate(-20 120 150)"/>
  <g class="group-a" transform="translate(220 60)">
    <rect width="60" height="60"/>
    <rect x="70" width="60" height="60"/>
    <circle id="special" cx="65" cy="130" r="40"/>
  </g>
</svg>
