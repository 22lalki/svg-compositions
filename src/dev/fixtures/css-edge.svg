<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 160" width="240" height="160">
  <!-- Пограничные случаи стилей и <use>: слой, скрытый классом; геометрия из CSS; цвет из таблицы стилей
       у <svg> и fill на <use> (содержимое <symbol> наследует от <use>); <use>, ссылающийся на <use> -->
  <style>
    svg { fill: #3f3d56 }
    .off { visibility: hidden }
    .big { r: 30px }
    .accent { fill: #ff6584 }
  </style>
  <defs>
    <symbol id="leaf" viewBox="0 0 20 20" width="40" height="40"><path d="M10 0 L20 20 L0 20 Z"/></symbol>
  </defs>
  <g class="off"><rect x="0" y="0" width="240" height="160" fill="#e11d48"/></g>
  <circle class="big accent" cx="45" cy="45" r="5"/>
  <use href="#leaf" x="100" y="10" fill="#6c63ff"/>
  <use href="#leaf" x="160" y="10"/>
  <rect id="tile" x="10" y="100" width="40" height="40" fill="#6c63ff"/>
  <use id="tile2" href="#tile" x="60"/>
  <use href="#tile2" x="60"/>
</svg>
